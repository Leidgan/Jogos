<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Chaveiro NFC - SNES Mobile</title>
    <!-- Emulador via biblioteca estável -->
    <script src="https://unpkg.com"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #1a1a1a; color: white; font-family: sans-serif; text-align: center; height: 100vh; display: flex; flex-direction: column; justify-content: center; }
        .menu { padding: 20px; z-index: 10; }
        select { padding: 15px; font-size: 18px; width: 80%; max-width: 300px; background: #333; color: white; border: 2px solid #555; border-radius: 8px; }
        #canvas-container { flex-grow: 1; width: 100%; height: 100%; display: none; position: relative; }
        canvas { width: 100% !important; height: auto !important; max-height: 100% !important; object-fit: contain; }
    </style>
</head>
<body>

    <div class="menu" id="menu-area">
        <h1>NFC SNES Emulator</h1>
        <p style="margin: 15px 0; color: #aaa;">Aproxime o chaveiro ou selecione o jogo:</p>
        
        <!-- IMPORTANTE: Mude o "value" abaixo para o nome EXATO do seu arquivo (respeitando maiúsculas/minúsculas) -->
        <select id="game-selector">
            <option value="">-- Escolha o Jogo --</option>
            <option value="supermario.smc.smc">Super Mario World</option>
        </select>
    </div>

    <div id="canvas-container"></div>

    <script>
        // Suas configurações travadas do GitHub
        const USUARIO_GITHUB = 'Leidgan';
        const REPOSITORIO_GITHUB = 'Jogos';

        let emuInstance = null;

        async function launchGame(romName) {
            if (!romName) return;
            
            document.getElementById('menu-area').style.display = 'none';
            document.getElementById('canvas-container').style.display = 'block';

            // Link absoluto usando os seus dados (Leidgan/Jogos)
            const absoluteRomUrl = `https://jsdelivr.net{USUARIO_GITHUB}/${REPOSITORIO_GITHUB}@main/${romName}`;

            try {
                emuInstance = await Nostalgist.snes({
                    rom: absoluteRomUrl,
                    element: '#canvas-container'
                });
            } catch (error) {
                console.error(error);
                alert(`ERRO DE LEITURA DA ROM!\n\nO emulador tentou buscar o arquivo:\n"${romName}"\n\nNo seu repositório: Leidgan/Jogos\n\nVerifique se o nome no código está IGUAL (letras maiúsculas/minúsculas) ao arquivo do seu repositório.`);
                location.reload();
            }
        }

        document.getElementById('game-selector').addEventListener('change', function() {
            launchGame(this.value);
        });

        // Leitura automática vinda do chaveiro NFC (?jogo=nome.smc)
        const urlParams = new URLSearchParams(window.location.search);
        const jogoViaNFC = urlParams.get('jogo');
        if (jogoViaNFC) {
            launchGame(jogoViaNFC);
        }
    </script>
</body>
</html>
